<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AARU AUTO PUMP TECHNOLOGIES</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>AARU AUTO PUMP TECHNOLOGIES</h1>
  <span id="saveStatus">Ready</span>
</header>

<div class="app">

  <aside>
    <button onclick="showPage('dashboard')">🏠 Dashboard</button>
    <button onclick="showPage('production')">📅 Production</button>
    <button onclick="showPage('manpower')">👷 Manpower</button>
    <button onclick="showPage('capacity')">⚙️ Capacity</button>
    <button onclick="showPage('downtime')">🔧 Downtime</button>
    <button onclick="showPage('quality')">🚫 Quality</button>
    <button onclick="showPage('reports')">📊 Reports</button>
    <button onclick="showPage('master')">🛠️ Zone / Machine</button>
  </aside>

  <main>

    <!-- DASHBOARD -->

    <section id="dashboard" class="page">

      <h2>Dashboard</h2>

      <div id="zones" class="zone-grid"></div>

      <div class="cards">

        <div class="card">
          <small>Total Plan</small>
          <b id="dPlan">0</b>
        </div>

        <div class="card">
          <small>Total Achieved</small>
          <b id="dAchieved">0</b>
        </div>

        <div class="card">
          <small>Balance</small>
          <b id="dBalance">0</b>
        </div>

        <div class="card">
          <small>Achievement %</small>
          <b id="dPercent">0%</b>
        </div>

      </div>

      <div class="panel">

        <h3>Process Flow</h3>

        <div id="flow" class="flow"></div>

      </div>

    </section>


    <!-- PRODUCTION -->

    <section id="production" class="page">

      <h2>Daily Production</h2>

      <div class="form">

        <label>
          Date
          <input type="date" id="pDate">
        </label>

        <label>
          Zone
          <select id="pZone"></select>
        </label>

        <label>
          Machine
          <select id="pMachine"></select>
        </label>

        <label>
          Plan
          <input type="number" id="pPlan">
        </label>

        <label>
          Achieved
          <input type="number" id="pAchieved">
        </label>

        <label>
          Remarks
          <input type="text" id="pRemarks">
        </label>

        <button onclick="saveProduction()">
          Save Production
        </button>

      </div>

      <div class="panel">

        <h3>Machine-wise Process Flow</h3>

        <div id="productionTable"></div>

      </div>

    </section>


    <!-- MANPOWER -->

    <section id="manpower" class="page">

      <h2>Manpower</h2>

      <div class="form">

        <input type="date" id="mDate">

        <select id="mZone"></select>

        <select id="mMachine"></select>

        <input type="number" id="mRequired"
               placeholder="Required">

        <input type="number" id="mAvailable"
               placeholder="Available">

        <button onclick="saveManpower()">
          Save
        </button>

      </div>

      <div class="panel">
        <div id="manpowerTable"></div>
      </div>

    </section>


    <!-- CAPACITY -->

    <section id="capacity" class="page">

      <h2>Capacity</h2>

      <div class="form">

        <select id="cZone"></select>

        <select id="cMachine"></select>

        <input type="number" id="cShift"
               placeholder="Capacity / Shift">

        <input type="number" id="cShifts"
               placeholder="Shifts / Day">

        <button onclick="saveCapacity()">
          Save
        </button>

      </div>

      <div class="panel">
        <div id="capacityTable"></div>
      </div>

    </section>


    <!-- DOWNTIME -->

    <section id="downtime" class="page">

      <h2>Downtime</h2>

      <div class="form">

        <input type="date" id="dtDate">

        <select id="dtZone"></select>

        <select id="dtMachine"></select>

        <input type="number" id="dtMinutes"
               placeholder="Minutes">

        <input type="text" id="dtReason"
               placeholder="Reason">

        <button onclick="saveDowntime()">
          Save
        </button>

      </div>

      <div class="panel">
        <div id="downtimeTable"></div>
      </div>

    </section>


    <!-- QUALITY -->

    <section id="quality" class="page">

      <h2>Quality / Rejection</h2>

      <div class="form">

        <input type="date" id="qDate">

        <select id="qZone"></select>

        <select id="qMachine"></select>

        <input type="number" id="qProduced"
               placeholder="Produced">

        <input type="number" id="qRejected"
               placeholder="Rejected">

        <input type="number" id="qRework"
               placeholder="Rework">

        <input type="text" id="qReason"
               placeholder="Reason">

        <button onclick="saveQuality()">
          Save
        </button>

      </div>

      <div class="panel">
        <div id="qualityTable"></div>
      </div>

    </section>


    <!-- REPORTS -->

    <section id="reports" class="page">

      <div class="report-head">

        <h2>Reports</h2>

        <button onclick="exportExcel()">
          📥 Export Excel
        </button>

      </div>

      <div id="reportTable"></div>

    </section>


    <!-- MASTER -->

    <section id="master" class="page">

      <h2>Zone / Machine Master</h2>

      <div class="form">

        <input id="newZone"
               placeholder="Zone Name">

        <input id="newMachine"
               placeholder="Machine Name">

        <input id="newOrder"
               type="number"
               placeholder="Process Order">

        <button onclick="addMachine()">
          Add Machine
        </button>

      </div>

      <div class="panel">

        <h3>Existing Machines</h3>

        <div id="masterTable"></div>

      </div>

    </section>

  </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<script type="module" src="app.js"></script>

</body>
  </html>
